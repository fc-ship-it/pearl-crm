<title>Pearl Demo — AHEAD LLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --panel-2: #eef1f6;
    --border: #dde3ec;
    --ink: #151b2e;
    --ink-dim: #5c6478;
    --gold: #c9a227;
    --gold-soft: #e8d190;
    --cyan: #2dd4c4;
    --magenta: #3b5bdb;
    --success: #17a673;
    --warning: #e0972e;
    --danger: #e5484d;
    --font-display: "Unbounded", "Segoe UI", sans-serif;
    --font-body: "Plus Jakarta Sans", "Segoe UI", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--ink); }
  body {
    margin: 0;
    font-family: var(--font-body);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  a { color: inherit; text-decoration: none; cursor: pointer; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; font-size: inherit; }
  input, select, textarea { font-family: inherit; font-size: inherit; }
  ::selection { background: var(--gold); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 1px 2px rgba(36,19,64,0.04); }
  .pill { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; }
  .btn-gold { background: var(--gold); color: var(--ink); font-weight: 600; border-radius: 12px; padding: 10px 18px; display: inline-flex; align-items: center; gap: 8px; }
  .btn-gold:hover { filter: brightness(1.04); }
  .btn-ghost { border: 1px solid var(--border); color: var(--ink); border-radius: 12px; padding: 10px 18px; }
  .field-label { font-size: 12px; color: var(--ink-dim); display: block; margin-bottom: 4px; }
  .field-input { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel-2); color: var(--ink); outline: none; }
  .field-input:focus { border-color: var(--gold); }
  .demo-banner { background: linear-gradient(90deg, var(--gold-soft), #fff); border-bottom: 1px solid var(--border); font-size: 12px; text-align: center; padding: 7px; color: var(--ink); }
  .demo-banner b { color: var(--magenta); }

  /* ---- marketing ---- */
  .nav { position: sticky; top: 0; z-index: 40; backdrop-filter: blur(8px); background: rgba(247,244,251,.85); border-bottom: 1px solid var(--border); }
  .nav-inner { max-width: 1200px; margin: 0 auto; padding: 0 20px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 14px; }
  .brand .bolt { color: var(--gold); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
  .hero { display: grid; grid-template-columns: 1fr; gap: 40px; padding: 56px 20px 48px; max-width: 1200px; margin: 0 auto; }
  @media (min-width: 980px) { .hero { grid-template-columns: 1.1fr 1fr; align-items: center; } }
  .eyebrow { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; background: rgba(212,168,67,.12); color: var(--gold); padding: 6px 12px; border-radius: 999px; display: inline-block; }
  .hero h1 { font-size: 34px; line-height: 1.15; margin-top: 16px; }
  @media (min-width: 700px) { .hero h1 { font-size: 44px; } }
  .grad-text { background: linear-gradient(90deg, var(--cyan), var(--magenta)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p.lede { color: var(--ink-dim); margin-top: 18px; max-width: 46ch; }
  .strip { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .strip-inner { max-width: 1200px; margin: 0 auto; padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 12px 32px; justify-content: center; font-size: 12px; color: var(--ink-dim); }
  .section { max-width: 1200px; margin: 0 auto; padding: 64px 20px; }
  .section-head { text-align: center; max-width: 600px; margin: 0 auto 40px; }
  .feat-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 700px) { .feat-grid { grid-template-columns: repeat(3, 1fr); } }
  .feat-card { padding: 20px; }
  .feat-icon { width: 40px; height: 40px; border-radius: 12px; background: rgba(212,168,67,.12); display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 12px; }
  .compare-grid { display: grid; grid-template-columns: 1fr; gap: 16px; max-width: 1200px; margin: 0 auto; padding: 0 20px 64px; }
  @media (min-width: 800px) { .compare-grid { grid-template-columns: 1fr 1fr; } }
  .compare-card { padding: 24px; }
  .compare-card ul { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .compare-card li { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
  .roi-box { border-radius: 20px; padding: 24px; }
  .slider-row { margin-bottom: 18px; }
  .slider-row input[type=range] { width: 100%; accent-color: var(--gold); }
  .roi-result { margin-top: 18px; border-radius: 14px; padding: 22px; text-align: center; background: linear-gradient(180deg, #151b2e, #0a0e1a); color: #fff; }
  .pricing-card { max-width: 420px; margin: 0 auto; padding: 26px; border: 1px solid var(--gold); }
  .faq-item { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .faq-q { width: 100%; display: flex; align-items: center; justify-content: space-between; text-align: left; gap: 16px; }
  footer.site { border-top: 1px solid var(--border); }
  .footer-grid { max-width: 1200px; margin: 0 auto; padding: 40px 20px; display: grid; gap: 24px; grid-template-columns: 1fr; }
  @media (min-width: 700px) { .footer-grid { grid-template-columns: repeat(3, 1fr); } }
  .chat-bubble { position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; border-radius: 999px; background: linear-gradient(135deg, var(--cyan), var(--magenta)); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(42,20,88,.25); z-index: 50; color: #fff; font-size: 22px; }

  /* ---- app shell ---- */
  .shell { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .sidebar .brand-row { height: 64px; display: flex; align-items: center; gap: 8px; padding: 0 20px; border-bottom: 1px solid var(--border); }
  .sidebar nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; font-size: 14px; color: var(--ink-dim); }
  .nav-item .ic { width: 17px; text-align: center; }
  .nav-item.active { background: linear-gradient(90deg, rgba(212,168,67,.18), rgba(239,44,140,.12)); color: var(--ink); border: 1px solid rgba(212,168,67,.35); }
  .sidebar-foot { padding: 12px; border-top: 1px solid var(--border); }
  .trial-chip { margin-bottom: 8px; padding: 8px 12px; border-radius: 10px; background: var(--panel-2); font-size: 12px; color: var(--ink-dim); }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--border); }
  .avatar { width: 32px; height: 32px; border-radius: 999px; background: var(--gold); color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  .content { flex: 1; overflow-y: auto; padding: 24px; }
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (min-width: 900px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
  .stat-card { padding: 16px; }
  .row-2col { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 16px; }
  @media (min-width: 1000px) { .row-2col { grid-template-columns: 2fr 1fr; } }
  .row-2col-even { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 16px; }
  @media (min-width: 900px) { .row-2col-even { grid-template-columns: 1fr 1fr; } }
  .list-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 12px; background: var(--panel-2); margin-bottom: 8px; gap: 12px; }
  .kanban { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 12px; }
  .kanban-col { width: 260px; flex-shrink: 0; border-radius: 16px; padding: 12px; background: var(--panel); border: 1px solid var(--border); min-height: 160px; }
  .deal-card { border-radius: 12px; padding: 12px; background: var(--panel-2); border: 1px solid var(--border); margin-bottom: 8px; }
  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data th { text-align: left; padding: 12px; font-weight: 400; color: var(--ink-dim); border-bottom: 1px solid var(--border); }
  table.data td { padding: 12px; border-bottom: 1px solid var(--border); }
  table.data tr:last-child td { border-bottom: none; }
  .task-check { width: 16px; height: 16px; border-radius: 5px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .task-check.done { background: var(--success); border-color: var(--success); color: #fff; font-size: 11px; }
  .section-card { padding: 20px; margin-bottom: 16px; }
  .integ-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 800px) { .integ-grid { grid-template-columns: repeat(3, 1fr); } }
  .plan-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 800px) { .plan-grid { grid-template-columns: repeat(3, 1fr); } }
  .plan-card { padding: 20px; }
  .plan-card.hl { border: 1px solid var(--gold); background: linear-gradient(180deg, rgba(212,168,67,.08), var(--panel)); }

  /* ---- qualification badges / filters / new contact / QR / campaigns ---- */
  .badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
  .tab-btn { padding: 10px 16px; font-size: 13px; color: var(--ink-dim); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--gold); font-weight: 600; }
  .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 16px; }
  .filter-bar .field-input { width: auto; min-width: 170px; }
  .qr-modal-backdrop { position: fixed; inset: 0; background: rgba(20,10,40,.6); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .qr-modal { width: 100%; max-width: 420px; background: #fff; border-radius: 18px; padding: 20px; max-height: 90vh; overflow-y: auto; }
  .qr-video-wrap { position: relative; border-radius: 12px; overflow: hidden; background: #111; aspect-ratio: 1; margin: 12px 0; }
  .qr-video-wrap video { width: 100%; height: 100%; object-fit: cover; }
  .camp-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 1000px) { .camp-grid { grid-template-columns: 2fr 1fr; } }
  .alert-item { border-radius: 12px; padding: 12px; background: var(--panel-2); margin-bottom: 8px; display: flex; gap: 10px; align-items: flex-start; }
  .alert-item.overdue { border: 1px solid var(--warning); background: rgba(224,151,46,.08); }
  .import-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px; border-radius: 10px; background: var(--panel-2); margin-bottom: 6px; }
  .dash-alert-banner { border: 1px solid var(--warning); background: rgba(224,151,46,.06); border-radius: 16px; padding: 16px; margin-bottom: 20px; }
  .source-pill { font-size: 10px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-dim); }
</style>

  var NEXT_STEP_HINTS = ["next step", "action item", "follow up", "follow-up", "to do", "we will send", "i will send", "let's talk", "let's connect"];
  var DECISION_HINTS = ["decided", "agreed", "approved", "we confirm", "let's proceed", "we'll proceed"];

  function generateMinutes(rawText, participantsHint) {
    var lines = splitLines(rawText);
    var keyPoints = [], decisions = [], objections = [], nextSteps = [], unclassified = [];
    lines.forEach(function (line) {
      var lower = line.toLowerCase();
      if (NEXT_STEP_HINTS.some(function(h){return lower.indexOf(h) !== -1;})) {
        nextSteps.push({ action: line, owner: participantsHint[0] || "Unassigned", dueDate: daysAgo(-5) });
      } else if (DECISION_HINTS.some(function(h){return lower.indexOf(h) !== -1;})) {
        decisions.push(line);
      } else if (OBJECTION_HINTS.some(function(h){return lower.indexOf(h) !== -1;})) {
        objections.push(line);
      } else if (line.length > 12) {
        keyPoints.push(line);
      } else {
        unclassified.push(line);
      }
    });
    if (keyPoints.length === 0 && unclassified.length > 0) keyPoints = keyPoints.concat(unclassified.slice(0,3));
    if (nextSteps.length === 0) nextSteps.push({ action: "Schedule a follow-up to confirm next steps", owner: participantsHint[0] || "Unassigned", dueDate: daysAgo(-5) });
    return { participants: participantsHint.filter(Boolean), keyPoints: keyPoints.slice(0,6), decisions: decisions.slice(0,4), objections: objections.slice(0,4), nextSteps: nextSteps.slice(0,5) };
  }

  /* ================= vCard parsing + QR payload classification (ported from src/lib/vcard.ts) ================= */
  function unfoldVCardLines(text) {
    var rawLines = text.replace(/\r\n/g, "\n").split("\n");
    var lines = [];
    rawLines.forEach(function (line) {
      if ((line.charAt(0) === " " || line.charAt(0) === "\t") && lines.length > 0) {
        lines[lines.length - 1] += line.slice(1);
      } else {
        lines.push(line);
      }
    });
    return lines;
  }
  function parseVCardFile(text) {
    var lines = unfoldVCardLines(text);
    var cards = [];
    var current = null;
    lines.forEach(function (line) {
      var trimmed = line.trim();
      if (/^BEGIN:VCARD$/i.test(trimmed)) { current = { name: "", email: "", phone: "", companyName: "" }; return; }
      if (/^END:VCARD$/i.test(trimmed)) { if (current && (current.name || current.email || current.phone)) cards.push(current); current = null; return; }
      if (!current) return;
      var idx = trimmed.indexOf(":");
      if (idx === -1) return;
      var propPart = trimmed.slice(0, idx);
      var value = trimmed.slice(idx + 1);
      var prop = propPart.split(";")[0].toUpperCase();
      if (prop === "FN") current.name = value.trim();
      else if (prop === "N" && !current.name) {
        var parts = value.split(";");
        current.name = [parts[1], parts[0]].filter(Boolean).join(" ").trim();
      } else if (prop === "EMAIL" && !current.email) current.email = value.trim();
      else if (prop === "TEL" && !current.phone) current.phone = value.trim();
      else if (prop === "ORG" && !current.companyName) current.companyName = value.split(";")[0].trim();
    });
    return cards;
  }
  function classifyQrPayload(raw) {
    var text = (raw || "").trim();
    if (/^BEGIN:VCARD/i.test(text)) {
      var cards = parseVCardFile(text);
      if (cards.length > 0) return { kind: "vcard", contact: cards[0] };
    }
    var waQr = text.match(/chat\.whatsapp\.com\/|wa\.me\/qr\//i);
    if (waQr) return { kind: "whatsapp-opaque", raw: text };
    var waNumber = text.match(/wa\.me\/(?:qr\/)?(\d{6,15})/i) || text.match(/[?&]phone=(\d{6,15})/i);
    if (waNumber) return { kind: "whatsapp", phone: "+" + waNumber[1] };
    var barePhone = text.match(/^\+?\d[\d\s-]{5,14}\d$/);
    if (barePhone) return { kind: "phone", phone: text.replace(/\s|-/g, "") };
    if (/^https?:\/\//i.test(text)) return { kind: "url", url: text };
    return { kind: "text", text: text };
  }

  function startQrCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      qrSetStatus("Camera access isn't available here — use the upload option below.");
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(function (stream) {
      var video = document.getElementById("qr-video");
      if (!video) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      qrCamera.stream = stream;
      video.srcObject = stream;
      qrCamera.scanning = true;
      qrScanFrame();
    }).catch(function () {
      qrSetStatus("Camera permission denied or unavailable — use the upload option below.");
    });
  }
  function stopQrCamera() {
    qrCamera.scanning = false;
    if (qrCamera.raf) cancelAnimationFrame(qrCamera.raf);
    qrCamera.raf = null;
    if (qrCamera.stream) { qrCamera.stream.getTracks().forEach(function (t) { t.stop(); }); qrCamera.stream = null; }
  }
  function qrScanFrame() {
    if (!qrCamera.scanning) return;
    var video = document.getElementById("qr-video");
    var canvas = document.getElementById("qr-canvas");
    if (!video || !canvas) return;
    if (typeof jsQR === "undefined") { qrSetStatus("QR decoding library unavailable — use the upload option below."); return; }
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code && code.data) { onQrDecoded(code.data); return; }
    }
    qrCamera.raf = requestAnimationFrame(qrScanFrame);

  function decodeQrFromImageFile(file) {

        if (typeof jsQR === "undefined") { qrSetStatus("QR decoding library unavailable."); return; }
        var canvas = document.createElement("canvas");
        canvas.width = img.width; canvas.height = img.height;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var code = jsQR(imageData.data, imageData.width, imageData.height);
        if (code && code.data) onQrDecoded(code.data);
        else qrSetStatus("No QR code found in that image — try another photo.");
      };
      img.onerror = function () { qrSetStatus("Couldn't read that image file."); };
      img.src = reader.result;
    };

    } else if (payload.kind === "phone") {

  function dashboardStats() {
    var open = deals.filter(function (d) { return d.stage.indexOf("closed") !== 0; });
    var won = deals.filter(function (d) { return d.stage === "closed_won"; });
    var lost = deals.filter(function (d) { return d.stage === "closed_lost"; });
    var pipelineValue = open.reduce(function (s, d) { return s + d.value; }, 0);
    var wonValue = won.reduce(function (s, d) { return s + d.value; }, 0);
    var conversionRate = deals.length ? Math.round((won.length / ((won.length + lost.length) || 1)) * 100) : 0;
    var atRisk = open.map(function (d) { return { deal: d, score: urgencyScore(d) }; }).filter(function (x) { return x.score > 0; }).sort(function (a, b) { return b.score - a.score; }).slice(0, 5);
    return { pipelineValue: pipelineValue, wonValue: wonValue, conversionRate: conversionRate, openCount: open.length, dealsAtRisk: atRisk };
  }

        '<div style="height:8px;border-radius:99px;background:var(--panel-2)"><div style="height:8px;border-radius:99px;width:' + Math.max(4,(val/max)*100) + '%;background:' + cfg.color + '"></div></div></div>';

  /* ================= contacts ================= */
  var contactFilters = { interest: "", budgetTier: "", targetSegment: "" };

    return out;
  }
  function filteredContacts() {
    return contacts.filter(function (c) {
      if (contactFilters.interest && (!c.interest || c.interest.toLowerCase().indexOf(contactFilters.interest.toLowerCase()) === -1)) return false;
      if (contactFilters.budgetTier && c.budgetTier !== contactFilters.budgetTier) return false;
      if (contactFilters.targetSegment && c.targetSegment !== contactFilters.targetSegment) return false;
      return true;
    });

  function qualificationBadges(c) {

  /* ================= render ================= */
  function render() {
    var app = document.getElementById("app");
    var chat = document.getElementById("chat");
    if (!state.loggedIn) {
      chat.innerHTML = "";
      if (state.route === "login") app.innerHTML = loginView();
      else if (state.route === "signup") app.innerHTML = signupView();
      else app.innerHTML = landingView();
      chat.innerHTML = chatWidgetHtml();
      return;
    }
    chat.innerHTML = "";
    var body, active;
    switch (state.route) {
      case "pipeline": body = pipelineView(); active = "pipeline"; break;
      case "contacts": body = contactsView(); active = "contacts"; break;
      case "contact": body = contactDetailView(state.params.id); active = "contacts"; break;
      case "meetings": body = meetingsView(); active = "meetings"; break;
      case "meeting": body = meetingDetailView(state.params.id); active = "meetings"; break;
      case "new-meeting": body = newMeetingView(); active = "meetings"; break;
      case "new-contact": body = newContactView(); active = "contacts"; break;
      case "campaigns": body = campaignsPageView(); active = "campaigns"; break;
      case "integrations": body = integrationsView(); active = "integrations"; break;
      case "billing": body = billingView(); active = "billing"; break;
      default: body = dashboardView(); active = "dashboard";
    }
    app.innerHTML = appShell(active, body);
  }

  var chatOpen = { open: true };
  function chatWidgetHtml() {
    if (!chatOpen.open) {
      return '<button class="chat-bubble" data-action="chat-open">&#128172;</button>';
    }
    return '<div style="position:fixed;bottom:20px;right:20px;width:260px;border-radius:16px;padding:16px;background:#fff;box-shadow:0 20px 40px rgba(42,20,88,.25);z-index:50">' +
      '<button data-action="chat-close" style="position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:99px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);color:#111">&times;</button>' +
      '<div style="display:flex;gap:10px"><div style="width:36px;height:36px;border-radius:99px;background:linear-gradient(135deg,var(--gold),var(--magenta));color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">FC</div>' +
      '<div><div style="font-size:13px;font-weight:600;color:#111">Hi, Federica here! 👋</div><div style="font-size:12px;color:#555;margin-top:4px">Got a question about Pearl? Ask away.</div></div></div></div>';
  }

  /* ================= events ================= */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-nav]");
    if (t) {
      e.preventDefault();
      var route = t.getAttribute("data-nav");
      var id = t.getAttribute("data-id");
      if (route === "contact") go("contact", { id: id });
      else if (route === "meeting") go("meeting", { id: id });
      else if (route === "new-contact") { resetNewContactState(); go("new-contact"); }
      else go(route);
      return;
    }
    var tabBtn = e.target.closest("[data-tab]");
    if (tabBtn) {
      newContactState.tab = tabBtn.getAttribute("data-tab");
      render();
      return;
    }
    var importCheck = e.target.closest("[data-import-check]");
    if (importCheck) {
      var ci = Number(importCheck.getAttribute("data-import-check"));
      if (newContactState.importPreview) newContactState.importPreview.selected[ci] = !newContactState.importPreview.selected[ci];
      render();
      return;
    }
    var toggleAlert = e.target.closest("[data-toggle-alert]");
    if (toggleAlert) {
      toggleCustomAlert(toggleAlert.getAttribute("data-toggle-alert"));
      render();
      return;
    }
    var action = e.target.closest("[data-action]");
    if (action) {
      var a = action.getAttribute("data-action");
      if (a === "login") { state.loggedIn = true; go("dashboard"); }
      else if (a === "logout") { state.loggedIn = false; go("landing"); }
      else if (a === "chat-open") { chatOpen.open = true; render(); }
      else if (a === "chat-close") { chatOpen.open = false; render(); }
      else if (a === "generate-minutes") {
        var titleEl = document.getElementById("nm-title");
        var contactEl = document.getElementById("nm-contact");
        var transcriptEl = document.getElementById("nm-transcript");
        var title = (titleEl.value || "Untitled meeting").trim();
        var contactId = contactEl.value;
        var transcript = transcriptEl.value || "";
        var participants = [currentUser.name, contactName(contactId)].filter(Boolean);
        var summary = generateMinutes(transcript, participants);
        var newId = "m" + meetings.length;
        var meeting = { id: newId, title: title, date: new Date().toISOString(), contactId: contactId, summary: summary };
        meetings.unshift(meeting);
        summary.nextSteps.forEach(function (step, i) {
          tasks.push({ id: "gt" + newId + "_" + i, title: step.action, dueDate: step.dueDate, done: false, contactId: contactId, dealId: null });
        });
        newMeetingDraft = { title: "", contactId: contacts[0].id, dealId: "", transcript: "" };
        go("meeting", { id: newId });
      }
      else if (a === "qr-open") { openQrModal(); }
      else if (a === "qr-close") { closeQrModal(); }
      else if (a === "submit-contact") {
        var d = newContactState.draft;
        d.name = (document.getElementById("nc-name") || {}).value || "";
        d.companyName = (document.getElementById("nc-company") || {}).value || "";
        d.email = (document.getElementById("nc-email") || {}).value || "";
        d.phone = (document.getElementById("nc-phone") || {}).value || "";
        d.interest = (document.getElementById("nc-interest") || {}).value || "";
        d.targetSegment = (document.getElementById("nc-segment") || {}).value || "";
        d.budgetTier = (document.getElementById("nc-budget") || {}).value || "";
        if (!d.name.trim()) { alert("Please enter a contact name."); return; }
        var created = addContact(d);
        resetNewContactState();
        go("contact", { id: created.id });
      }
      else if (a === "import-cancel") { newContactState.importPreview = null; render(); }
      else if (a === "import-confirm") {
        var preview = newContactState.importPreview;
        if (preview) {
          var tagInterest = (document.getElementById("imp-interest") || {}).value || "";
          var tagSegment = (document.getElementById("imp-segment") || {}).value || "";
          var tagBudget = (document.getElementById("imp-budget") || {}).value || "";
          var selectedContacts = preview.contacts.filter(function (c, i) { return preview.selected[i]; });
          var result = importContacts(selectedContacts, { interest: tagInterest, targetSegment: tagSegment, budgetTier: tagBudget });
          resetNewContactState();
          go("contacts");
          setTimeout(function () { alert("Imported " + result.imported + " contact" + (result.imported === 1 ? "" : "s") + (result.skipped ? (" · skipped " + result.skipped + " duplicate" + (result.skipped === 1 ? "" : "s")) : "") + "."); }, 30);
        }
      }
      else if (a === "apply-filters") {
        contactFilters.interest = (document.getElementById("cf-interest") || {}).value || "";
        contactFilters.budgetTier = (document.getElementById("cf-budget") || {}).value || "";
        contactFilters.targetSegment = (document.getElementById("cf-segment") || {}).value || "";
        render();
      }
      else if (a === "clear-filters") { contactFilters = { interest: "", budgetTier: "", targetSegment: "" }; render(); }
      else if (a === "save-campaign") {
        campaignDraft.title = (document.getElementById("camp-title") || {}).value || "";
        campaignDraft.message = (document.getElementById("camp-message") || {}).value || "";
        campaignDraft.channel = (document.getElementById("camp-channel") || {}).value || "whatsapp";
        if (!campaignDraft.title.trim() || !campaignDraft.message.trim()) { alert("Please fill in a campaign title and message."); return; }
        createCampaign(campaignDraft);
        campaignDraft = { title: "", message: "", channel: "whatsapp", interest: "", budgetTier: "", targetSegment: "" };
        render();
      }
      else if (a === "toggle-alert-form") { alertFormOpen = !alertFormOpen; render(); }
      else if (a === "save-alert") {
        alertDraft.title = (document.getElementById("al-title") || {}).value || "";
        alertDraft.remindAt = (document.getElementById("al-remind") || {}).value || "";
        if (!alertDraft.title.trim() || !alertDraft.remindAt) { alert("Please fill in a title and a date/time."); return; }
        createCustomAlert(alertDraft.title, new Date(alertDraft.remindAt).toISOString());
        alertDraft = { title: "", remindAt: "" };
        alertFormOpen = false;
        render();
      }
      else if (a === "send-campaign") { triggerSendCampaign(action.getAttribute("data-id")); }
      return;
    }
    var move = e.target.closest("[data-move]");
    if (move && !move.disabled) {
      var parts = move.getAttribute("data-move").split(",");
      var dealId = parts[0], newStage = parts[1];
      if (newStage) { var d = byId(deals, dealId); if (d) d.stage = newStage; render(); }
      return;
    }
    var toggleTask = e.target.closest("[data-toggle-task]");
    if (toggleTask) {
      var tid = toggleTask.getAttribute("data-toggle-task");
      var task = byId(tasks, tid);
      if (task) task.done = !task.done;
      render();
      return;
    }
    var toggleInteg = e.target.closest("[data-toggle-integ]");
    if (toggleInteg) {
      var provider = toggleInteg.getAttribute("data-toggle-integ");
      integrations[provider] = !integrations[provider];
      render();
      return;
    }
    var faq = e.target.closest("[data-faq]");
    if (faq) {
      var idx = Number(faq.getAttribute("data-faq"));
      faqOpen = faqOpen === idx ? -1 : idx;
      render();
      return;
    }
    var pipeMove = e.target.closest("[data-pipe-move]");
    if (pipeMove && !pipeMove.disabled) {
      var pm = pipeMove.getAttribute("data-pipe-move").split(",");
      var cardId = pm[0], from = pm[1], dir = Number(pm[2]);
      var idxCol = PIPE_COLS.indexOf(from);
      var to = PIPE_COLS[idxCol + dir];
      if (to) {
        var cardIdx = -1;
        pipelineDemoState[from].forEach(function (c, i) { if (c.id === cardId) cardIdx = i; });
        if (cardIdx > -1) {
          var card = pipelineDemoState[from].splice(cardIdx, 1)[0];
          pipelineDemoState[to].push(card);
          render();
        }
      }
      return;
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target.id === "nm-title") newMeetingDraft.title = e.target.value;
    if (e.target.id === "nm-transcript") newMeetingDraft.transcript = e.target.value;
    if (e.target.matches("[data-roi]")) {
      roiState[e.target.getAttribute("data-roi")] = Number(e.target.value);
      render();
    }
    var d = newContactState.draft;
    if (e.target.id === "nc-name") d.name = e.target.value;
    if (e.target.id === "nc-company") d.companyName = e.target.value;
    if (e.target.id === "nc-email") d.email = e.target.value;
    if (e.target.id === "nc-phone") d.phone = e.target.value;
    if (e.target.id === "nc-interest") d.interest = e.target.value;
    if (e.target.id === "nc-segment") d.targetSegment = e.target.value;
    if (e.target.id === "camp-title") campaignDraft.title = e.target.value;
    if (e.target.id === "camp-message") campaignDraft.message = e.target.value;
    if (e.target.id === "camp-interest") { campaignDraft.interest = e.target.value; render(); }
    if (e.target.id === "al-title") alertDraft.title = e.target.value;
    if (e.target.id === "al-remind") alertDraft.remindAt = e.target.value;
    if (newContactState.importPreview) {
      if (e.target.id === "imp-interest") newContactState.importPreview.tagInterest = e.target.value;
      if (e.target.id === "imp-segment") newContactState.importPreview.tagTargetSegment = e.target.value;
    }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "nm-contact") { newMeetingDraft.contactId = e.target.value; newMeetingDraft.dealId = ""; render(); }
    if (e.target.id === "nm-deal") newMeetingDraft.dealId = e.target.value;
    if (e.target.id === "nc-budget") newContactState.draft.budgetTier = e.target.value;
    if (e.target.id === "camp-channel") campaignDraft.channel = e.target.value;
    if (e.target.id === "camp-budget") { campaignDraft.budgetTier = e.target.value; render(); }
    if (e.target.id === "camp-segment") { campaignDraft.targetSegment = e.target.value; render(); }
    if (newContactState.importPreview && e.target.id === "imp-budget") newContactState.importPreview.tagBudgetTier = e.target.value;
    if (e.target.id === "qr-file" && e.target.files && e.target.files[0]) decodeQrFromImageFile(e.target.files[0]);
    if (e.target.id === "nc-qr-upload" && e.target.files && e.target.files[0]) decodeQrFromImageFile(e.target.files[0]);
    if (e.target.id === "nc-import-file" && e.target.files && e.target.files[0]) handleVcfFile(e.target.files[0]);
  });

  render();
})();
</script>
